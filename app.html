<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>Assistente Personale</title>
<style>
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}


:root{
  --bg:#ffffff;
  --fg:#000000;
  --muted:#6c6c70;
  --fill:#f2f2f7;
  --line:#e5e5ea;
  --blue:#007aff;
  --blue-dark:#0062cc;
  --red:#ff3b30;
  --green:#248a3d;
  --orange:#c93400;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 104px;min-height:100vh}
.nav{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:22px 10px}
.nav h1{margin:0;font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.nav .acts{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
.user-badge{display:inline-flex;align-items:center;max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--fill)}
